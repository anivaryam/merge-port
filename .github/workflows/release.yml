name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build and package binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            bin="merge-port"
            if [ "$GOOS" = "windows" ]; then
              bin="merge-port.exe"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            TMP="$(mktemp -d)"
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "${TMP}/${bin}" ./cmd/mergeport

            archive="merge-port_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd "$TMP" && zip -q "${OLDPWD}/dist/${archive}.zip" "$bin")
            else
              tar -czf "dist/${archive}.tar.gz" -C "$TMP" "$bin"
            fi
            rm -rf "$TMP"
          done

          (cd dist && sha256sum merge-port_* > checksums.txt)

      - name: Smoke test archives
        run: |
          set -euo pipefail
          for archive in dist/merge-port_*; do
            case "$archive" in
              *.tar.gz)
                TMP="$(mktemp -d)"
                tar -xzf "$archive" -C "$TMP"
                test -f "$TMP/merge-port"
                file "$TMP/merge-port" || true
                if echo "$archive" | grep -q 'linux_amd64'; then
                  "$TMP/merge-port" --version
                fi
                rm -rf "$TMP"
                ;;
              *.zip)
                TMP="$(mktemp -d)"
                unzip -q "$archive" -d "$TMP"
                test -f "$TMP/merge-port.exe"
                file "$TMP/merge-port.exe" || true
                rm -rf "$TMP"
                ;;
            esac
            grep "  $(basename "$archive")$" dist/checksums.txt
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
